# Lightweight development stack: Django runserver + PostgreSQL only.
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tablereserve
      POSTGRES_USER: tablereserve
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: insecure-dev-key-change-me
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      WAIT_FOR_DB: "1"
    # Live-reload the source for local development.
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

volumes:
  pgdata_dev:
