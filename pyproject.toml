[project]
name = "tablereserve"
version = "1.0.0"
description = "Kafe stol rezervatsiyasi platformasi (TableReserve)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
# Target the lowest supported interpreter so the 3.11+3.12 CI matrix stays green.
target-version = "py311"
line-length = 100
src = ["apps", "config", "tests"]
extend-exclude = [
    "migrations",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "SIM", # flake8-simplify
]
ignore = [
    "B008",  # function calls in argument defaults (DRF/Django patterns)
    "DJ001", # null=True on string fields (used intentionally for AuditLog)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "migrations",
    ".venv",
    "tests",
]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests", "apps"]
addopts = "--cov=apps --cov-report=term-missing --cov-report=xml --reuse-db"

[tool.coverage.run]
branch = true
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/apps.py",
    "*/admin.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "def __str__",
]
