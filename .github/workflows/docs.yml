# Render UML diagrams from their sources via Kroki (NFR-12).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/diagrams/**"
      - "scripts/render_diagrams.py"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagrams:
    name: Render diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render diagrams (graceful degrade if Kroki is unreachable)
        run: python scripts/render_diagrams.py --formats svg png

      - name: Upload rendered diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: |
            docs/diagrams/*.svg
            docs/diagrams/*.png
          if-no-files-found: ignore
          retention-days: 14
