# Continuous Deployment: staging then production with manual approval (FR-25, NFR-07).
# Each environment uses GitHub Environments, so the production job only runs after
# a reviewer approves it. A /health/ smoke-test gates each deploy.
name: CD

on:
  # Deploy after the Docker image is published on main, or run on demand.
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only proceed when the upstream Docker workflow succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        # The real deploy command runs on the server. Only the specific vars /
        # secrets a step needs are referenced, never a full environment dump.
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "STAGING_HOST not configured; skipping staging deploy."
            exit 0
          fi
          echo "Deploying image to staging host ..."
          echo "Target host configured via STAGING_HOST secret."
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}

      - name: Smoke-test /health/
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL not configured; skipping smoke test."
            exit 0
          fi
          echo "Checking staging health endpoint ..."
          curl -fsS "${STAGING_URL%/}/health/"
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}

  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: staging
    # The 'production' Environment requires a manual approval (configured in
    # repo settings) before this job starts.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          if [ -z "$PRODUCTION_HOST" ]; then
            echo "PRODUCTION_HOST not configured; skipping production deploy."
            exit 0
          fi
          echo "Deploying image to production host ..."
          echo "Target host configured via PRODUCTION_HOST secret."
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}

      - name: Smoke-test /health/
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL not configured; skipping smoke test."
            exit 0
          fi
          echo "Checking production health endpoint ..."
          curl -fsS "${PRODUCTION_URL%/}/health/"
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
